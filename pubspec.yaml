name: ntsapp
description: "Note Safe - Encrypted notes"
publish_to: "none"
version: 2.2.4+71

environment:
  sdk: ^3.5.1

dependencies:
  archive: ^4.0.9
  audioplayers: ^6.1.0
  bip39: ^1.0.6
  change_app_package_name: ^1.4.0
  chewie: ^1.8.5
  crypto: ^3.0.6
  device_info_plus: ^13.2.0
  encrypt: ^5.0.3
  file_picker: ^12.0.0-beta.7
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  flutter:
    sdk: flutter
  flutter_contacts: ^2.1.0
  flutter_launcher_icons: ^0.14.1
  flutter_local_notifications: ^22.0.1
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.1
  flutter_native_splash: ^2.4.3
  flutter_secure_storage: ^10.3.1
  geolocator: ^14.0.3
  hive_flutter: ^1.1.0
  http: ^1.2.2
  image: ^4.3.0
  image_picker: ^1.1.2
  intl: any
  latlong2: ^0.10.1
  local_auth: ^3.0.2
  lucide_icons: ^0.257.0
  media_kit: ^1.1.11
  media_kit_libs_video: ^1.0.5
  media_kit_video: ^2.0.1
  metadata_fetch: ^0.4.2
  mime: ^2.0.0
  open_filex: ^4.6.0
  package_info_plus: ^10.2.1
  path: ^1.9.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.3
  provider: ^6.1.2
  purchases_flutter: ^10.4.1
  random_string: ^2.3.1
  receive_sharing_intent: 1.8.1
  record: ^6.0.0
  scrollable_positioned_list: ^0.3.8
  share_plus: ^13.2.1
  siri_wave: ^2.1.0
  sodium_libs: ^3.4.3
  sqflite: ^2.4.0
  sqflite_common_ffi: ^2.3.4
  supabase_flutter: ^2.8.3
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  video_player: ^2.9.2
  window_size: ^0.2.0
  workmanager: ^0.9.0+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
        - asset: fonts/Inter-Medium.ttf
        - asset: fonts/Inter-Light.ttf
        - asset: fonts/Inter-SemiBold.ttf
        - asset: fonts/Inter-Bold.ttf

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: true

flutter_native_splash:
  android: true
  ios: false
  web: false
  image: assets/splash.png
  color: "#16161A"
  android_12:
    image: assets/splash.png
    color: "#16161A"
